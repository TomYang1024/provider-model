# 使用 Docker Secrets 代替环境变量注入密钥：
#   mkdir -p secrets && chmod 700 secrets
#   printf '%s' "$KEY" > secrets/deepseek_api_key   （空文件表示禁用该 Provider）
#   docker compose -f compose.yaml -f compose.secrets.yaml up -d
#
# 密钥以文件形式挂载到 /run/secrets/，SDK 通过 *_FILE 环境变量读取，
# 不会出现在 docker inspect 的环境变量中。
services:
  provider-gateway:
    secrets:
      - deepseek_api_key
      - glm_api_key
      - kimi_api_key
      - qwen_api_key
      - gateway_api_keys
    environment:
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      GLM_API_KEY_FILE: /run/secrets/glm_api_key
      KIMI_API_KEY_FILE: /run/secrets/kimi_api_key
      QWEN_API_KEY_FILE: /run/secrets/qwen_api_key
      GATEWAY_API_KEYS_FILE: /run/secrets/gateway_api_keys

secrets:
  deepseek_api_key:
    file: ./secrets/deepseek_api_key
  glm_api_key:
    file: ./secrets/glm_api_key
  kimi_api_key:
    file: ./secrets/kimi_api_key
  qwen_api_key:
    file: ./secrets/qwen_api_key
  gateway_api_keys:
    file: ./secrets/gateway_api_keys
